name: CI - Restaurante Demo

on:
  push:
    branches: [principal, main, master]
  pull_request:
    branches: [principal, main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint --if-present
        continue-on-error: true

      - name: Run tests
        run: npm test

      - name: Verify app starts
        run: node -e "require('./src/app.js')"
        continue-on-error: true
