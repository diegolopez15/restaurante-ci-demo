name: CI - Restaurante Demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Obtener el código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Instalar dependencias
        run: npm ci

      - name: 4. Análisis estático (lint)
        run: npm run lint --if-present

      - name: 5. Ejecutar pruebas
        run: npm test

      - name: 6. Construir (verificar que arranca)
        run: node -e "require('./src/app.js')"