name: CI - Restaurante Demo

on:
  push:
    branches: [main, master, principal]
  pull_request:
    branches: [main, master, principal]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Obtener el código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 3. Instalar dependencias
        run: npm install

      - name: 4. Análisis estático (lint)
        run: npm run lint --if-present
        continue-on-error: true

      - name: 5. Ejecutar pruebas
        run: npm test

      - name: 6. Verificar que la aplicación arranca
        run: node -e "require('./src/app.js')"
        continue-on-error: true
